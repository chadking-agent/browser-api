[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-api"
version = "0.3.0"
description = "OpenAI-compatible HTTP proxy that automates a web chat interface via Playwright and your own login profile"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "browser-api contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sse-starlette>=2.2,<4",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "pytest>=8,<10", "build>=1.2", "twine>=5"]

[project.scripts]
browser-api-server = "browser_api.openai_router:main"
browser-api = "browser_api.providers:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
